name: Release

# Adds espsomfy_rts.zip to each release: the integration's tracked files with
# the release's version written in, and a signed attestation that this
# workflow made it from the release's commit. HACS installs this zip
# (zip_release in hacs.json), so until it is uploaded HACS can't install the
# release. Then commits a stable release's version to the release's branch.
on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, so two version commits don't race to the branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the release's files, the version commit
      id-token: write       # Sigstore signs the attestation
      attestations: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on a tag that isn't a version Home Assistant loads, so the
      # release gets no zip.
      - name: Set version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/set_version.sh "$TAG"

      # Only the tracked files, with the version, at the zip's root: what goes
      # into custom_components/espsomfy_rts. The commit's date on every file,
      # so a rerun with the same git gives the same zip and SHA256SUMS.
      - name: Zip the integration
        run: |
          mkdir dist
          git add custom_components/espsomfy_rts
          git archive --format=zip --mtime="$(git log -1 --format=%cI)" \
            -o dist/espsomfy_rts.zip "$(git write-tree):custom_components/espsomfy_rts"
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      #   gh attestation verify espsomfy_rts.zip --repo cjkas/ESPSomfy-RTS-HA
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/espsomfy_rts.zip

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # The release's branch as it is now, not the tag. Pre-releases leave the
      # branch on the last stable version.
      - name: Check out the release's branch
        if: ${{ !github.event.release.prerelease }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}
          persist-credentials: true # pushes the version commit

      # Skipped when the release was made from a commit rather than a branch,
      # and when the branch already has this version or a newer one: a rerun,
      # or a release of an older tag.
      - name: Commit version update
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if ! git ls-remote --exit-code --heads origin "refs/heads/$TARGET" >/dev/null; then
            echo "$TARGET isn't a branch, not committing $TAG"
            exit 0
          fi
          bash .github/set_version.sh --if-newer "$TAG"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $TAG"
          git push origin "HEAD:$TARGET"
